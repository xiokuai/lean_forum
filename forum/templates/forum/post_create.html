{% extends 'base.html' %}

{% block title %}发新帖{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
      <h1 class="mb-4">发新帖</h1>

        {% csrf_token %} {{ form.as_p }}

      </form>
    </div>
  </div>
{% endblock %}
